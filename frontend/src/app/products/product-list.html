<header class="page-header">
  <h1>Products</h1>
  <a matButton="filled" routerLink="/products/new">
    <mat-icon>add</mat-icon>
    New product
  </a>
</header>

<div class="progress">
  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }
</div>

@if (error(); as message) {
  <div class="message error" role="alert">
    <span>{{ message }}</span>
    <button matButton (click)="load()">Try again</button>
  </div>
} @else if (loaded() && products().length === 0) {
  <div class="message">
    <span>No products yet. Add the first one to create campaigns for it.</span>
  </div>
} @else if (products().length > 0) {
  <table mat-table [dataSource]="products()">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let product">{{ product.name }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef><span class="visually-hidden">Actions</span></th>
      <td mat-cell *matCellDef="let product" class="actions">
        <a
          matIconButton
          [routerLink]="['/products', product.id, 'edit']"
          [attr.aria-label]="'Edit ' + product.name"
          matTooltip="Edit"
        >
          <mat-icon>edit</mat-icon>
        </a>
        <button
          matIconButton
          (click)="confirmDelete(product)"
          [attr.aria-label]="'Delete ' + product.name"
          matTooltip="Delete"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
}
